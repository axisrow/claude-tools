# permissions-audit.conf — конфиг для bin/permissions-audit.
# env PERMISSIONS_AUDIT_CONF переопределяет путь к этому файлу.
#
# Формат: секции разделены строками-маркерами "--- NAME" (без # префикса!).
# Правила заимствованы из permissions-optimizer (axisrow/permissions-optimizer, optimize.py).

--- DANGEROUS
# команды, для которых Bash(<cmd>:*) → warn (Carte blanche). Одно слово на строку.
git
gh
rm
node
npm
npx
docker
curl
wget
chmod
chown
sudo
dd
kill
mv
cp

--- SCOPED
# suggest в audit-репорте (НЕ merge). Формат: cmd:sub1 sub2 sub3
git: add diff status log show fetch pull
gh: pr view pr list issue view issue list
npm: install run test ci
docker: ps images logs inspect

--- DEPRECATED
# bash regex (через =~), применяется к команде внутри Bash(...). cleanup удаляет.
^claude($|[^a-z])
^cd[[:space:]]
GIT_SSL_NO_VERIFY
^Read$
^Read\(
gh[[:space:]]+pr[[:space:]]+merge[[:space:]]+[0-9]
^g?timeout[[:space:]]+[0-9]
^echo[[:space:]]+\"EXIT
^source[[:space:]]+\.env
